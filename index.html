<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pour Maëlys ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fff8f2,#f3e4dc 55%,#ead3c9);color:#342824;font-family:'Cormorant Garamond',serif;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(680px,100%);background:rgba(255,252,248,.95);border:1px solid rgba(112,70,55,.2);box-shadow:0 18px 60px rgba(65,35,25,.16);border-radius:22px;padding:42px 34px;text-align:center}.heart{font-size:34px}.eyebrow{font-family:Montserrat,sans-serif;text-transform:uppercase;letter-spacing:3px;font-size:11px;color:#8b6255;margin-top:8px}.title{font-size:42px;margin:8px 0 4px;font-weight:600}.question{font-size:28px;line-height:1.25;margin:25px auto;max-width:570px}.hint{font-family:Montserrat,sans-serif;font-size:12px;color:#8a7770;margin:0 0 16px}.answers{display:flex;flex-direction:column;gap:10px;max-width:430px;margin:0 auto}.answers input,.two input{font:500 17px Montserrat,sans-serif;padding:15px 17px;border-radius:12px;border:1px solid #cbb4aa;outline:none;text-align:center;background:#fff}.answers input:focus,.two input:focus{border-color:#8b6255;box-shadow:0 0 0 3px rgba(139,98,85,.12)}button{font:600 13px Montserrat,sans-serif;letter-spacing:.7px;border:0;border-radius:12px;padding:14px 22px;cursor:pointer;background:#5c3b31;color:white;transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:430px;margin:0 auto 10px}.error{color:#9a3f36;font-family:Montserrat,sans-serif;font-size:12px;min-height:20px;margin-top:12px}.progress{font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:2px;color:#9a8076;margin-bottom:22px}.success{font-size:24px;line-height:1.35;margin:25px 0}.unlock{display:inline-block;text-decoration:none;color:white;background:#5c3b31;padding:15px 24px;border-radius:12px;font:600 12px Montserrat,sans-serif;letter-spacing:1px}.small{font-family:Montserrat,sans-serif;font-size:10px;color:#9a8881;margin-top:20px}@media(max-width:520px){.card{padding:32px 20px}.title{font-size:35px}.question{font-size:25px}.two{grid-template-columns:1fr}}
</style></head><body><main class="card" id="app"></main>
<script>
const steps=[
{q:'Quel est le prénom du mec qui t’aime comme un fou ?',hint:'Une réponse suffit.',answers:['remi','rémi','rémy']},
{q:'Dans quelle ville Rémi t’a-t-il dit « je t’aime » pour la première fois ?',hint:'Indice : 5 lettres.',answers:['vitry']},
{q:'Comment s’appellera ta future agence de voyage ?',hint:'Écris le nom de l’agence.',answers:['mlstravel','mls travel']},
{q:'Comment s’appelleront notre futur fils et notre future fille ?',hint:'Il faut trouver les deux prénoms.',answers:['alejandro|bianca']},
{q:'Le dernier verrou est composé de 8 chiffres. Ce code correspond à une date que nous sommes les seuls à pouvoir connaître. À toi de la retrouver.',hint:'Format attendu : 8 chiffres.',answers:['16072026','16 07 2026']}];
let step=0;const app=document.getElementById('app');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function render(){if(step>=steps.length){app.innerHTML='<div class="heart">❤️</div><div class="eyebrow">ACCÈS AUTORISÉ</div><h1 class="title">Tu as réussi, Maë.</h1><p class="success">Maintenant, ouvre ce qui t’attend.<br><br><em>Tout ce que j’ai à te dire est dans ces pages.</em></p><a class="unlock" href="Pour_Maelys_poeme_protege.pdf" target="_blank">OUVRIR MON CADEAU</a><p class="small">Le PDF te demandera le code final pour s’ouvrir.</p>';return}const s=steps[step];let input=step===3?'<div class="two"><input id="a1" autocomplete="off" placeholder="Prénom du fils"><input id="a2" autocomplete="off" placeholder="Prénom de la fille"></div><button onclick="check()">VALIDER</button>':'<div class="answers"><input id="answer" autocomplete="off" placeholder="Ta réponse"><button onclick="check()">VALIDER</button></div>';app.innerHTML='<div class="progress">ÉPREUVE '+(step+1)+' / 5</div><div class="heart">♡</div><div class="eyebrow">Une petite surprise pour toi</div><h1 class="title">À toi de jouer</h1><p class="question">'+s.q+'</p><p class="hint">'+s.hint+'</p>'+input+'<div class="error" id="error"></div>';if(step===3){document.getElementById('a1').focus()}else{document.getElementById('answer').focus()}document.querySelectorAll('input').forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')check()}))}
function check(){let ok=false;if(step===3)ok=norm(document.getElementById('a1').value)==='alejandro'&&norm(document.getElementById('a2').value)==='bianca';else ok=steps[step].answers.some(a=>norm(a)===norm(document.getElementById('answer').value));if(ok){step++;render()}else document.getElementById('error').textContent='Hmm… ce n’est pas la bonne réponse. Réessaie ❤️'}render();
</script></body></html>
